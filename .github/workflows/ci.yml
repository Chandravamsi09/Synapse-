name: Synapse Enterprise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter & Static Analysis
        run: npm run lint

      - name: Execute Automated Test Suite (Unit & Integration)
        run: npm test

      - name: Validate Codebase LOC Volume
        run: npm run loc

  docker-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        run: |
          docker build -t synapse-api:latest -f docker/Dockerfile.api .

      - name: Build Web Portal Container Image
        run: |
          docker build -t synapse-web:latest -f docker/Dockerfile.web .
